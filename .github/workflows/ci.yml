name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build frontend bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_key_placeholder
          VITE_API_URL: http://localhost:5000
          VITE_SOCKET_URL: http://localhost:5000
        run: npm run build

  backend:
    name: Backend (Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: Backend Startup Smoke Check (/health)
        env:
          PORT: 5000
          CLIENT_URL: http://localhost:5173
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viva_test
          CLERK_SECRET_KEY: sk_test_ci_placeholder_key
        run: |
          node dist/server.js &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke check passed: /health returned HTTP 200"
              kill $SERVER_PID
              exit 0
            fi
            echo "Waiting for backend health response (attempt $i/15, status: $STATUS)..."
            sleep 1
          done

          echo "Backend smoke check timed out"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
